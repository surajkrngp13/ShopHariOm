function generateId(prefix) {
    const randomPart =
        crypto.randomUUID
            ? crypto.randomUUID().replace(/-/g, "")
            : Date.now().toString(36) + Math.random().toString(36).slice(2);

    return prefix + "-" + Date.now() + "-" + randomPart;
}

function generateNonce() {
    if (crypto.randomUUID) {
        return crypto.randomUUID() + "-" + crypto.randomUUID();
    }

    const array = new Uint8Array(32);
    crypto.getRandomValues(array);

    return Array.from(array)
        .map(value => value.toString(16).padStart(2, "0"))
        .join("");
}

function putLocal(storeName, value) {
    return openDatabase().then(db => {
        return new Promise((resolve, reject) => {
            const transaction = db.transaction(
                storeName,
                "readwrite"
            );

            const store = transaction.objectStore(storeName);

            store.put(value);

            transaction.oncomplete = () => {
                db.close();
                resolve();
            };

            transaction.onerror = () => {
                db.close();
                reject(
                    transaction.error ||
                    new Error("INDEXEDDB_WRITE_FAILED")
                );
            };

            transaction.onabort = () => {
                db.close();
                reject(
                    transaction.error ||
                    new Error("INDEXEDDB_TRANSACTION_ABORTED")
                );
            };
        });
    });
}

async function getUserProfile(uid) {
    const snapshot = await get(
        ref(database, "users/" + uid)
    );

    if (!snapshot.exists()) {
        throw new Error("USER_PROFILE_NOT_FOUND");
    }

    const data = snapshot.val();

    if (!data || typeof data !== "object") {
        throw new Error("INVALID_USER_PROFILE");
    }

    const role = String(data.role || "").toLowerCase();
    const status = String(data.status || "").toLowerCase();

    if (role !== "admin" && role !== "agent") {
        throw new Error("INVALID_USER_ROLE");
    }

    if (status !== "active") {
        throw new Error("USER_ACCOUNT_DISABLED");
    }

    if (role === "agent" && !data.shopId) {
        throw new Error("AGENT_SHOP_NOT_ASSIGNED");
    }

    return {
        name: String(data.name || ""),
        email: String(data.email || ""),
        role: role,
        shopId: String(data.shopId || ""),
        status: status,
        createdAt: Number(data.createdAt || 0),
        lastLogin: Number(data.lastLogin || 0)
    };
}

async function recoverSyncQueue() {
    const db = await openDatabase();

    return new Promise((resolve, reject) => {
        const transaction = db.transaction(
            "sync_queue",
            "readwrite"
        );

        const store = transaction.objectStore("sync_queue");
        const request = store.openCursor();

        request.onsuccess = event => {
            const cursor = event.target.result;

            if (!cursor) {
                return;
            }

            const item = cursor.value;

            if (item.syncStatus === "SYNCING") {
                item.syncStatus = "PENDING";
                item.updatedAt = Date.now();
                item.lastError = "RECOVERED_AFTER_INTERRUPTED_SYNC";

                cursor.update(item);
            }

            cursor.continue();
        };

        transaction.oncomplete = () => {
            db.close();
            resolve();
        };

        transaction.onerror = () => {
            db.close();
            reject(
                transaction.error ||
                new Error("SYNC_QUEUE_RECOVERY_FAILED")
            );
        };
    });
}

async function syncPendingRecords() {
    if (!navigator.onLine) {
        return;
    }

    if (
        !APP_CONFIG.APPS_SCRIPT_URL ||
        APP_CONFIG.APPS_SCRIPT_URL === "YOUR_APPS_SCRIPT_WEB_APP_URL"
    ) {
        return;
    }

    const currentUser = auth.currentUser;

    if (!currentUser) {
        return;
    }

    const db = await openDatabase();

    const items = await new Promise((resolve, reject) => {
        const transaction = db.transaction(
            "sync_queue",
            "readonly"
        );

        const store = transaction.objectStore("sync_queue");
        const request = store.openCursor();
        const result = [];

        request.onsuccess = event => {
            const cursor = event.target.result;

            if (!cursor) {
                resolve(result);
                return;
            }

            const item = cursor.value;

            if (
                item.syncStatus === "PENDING" ||
                item.syncStatus === "ERROR" ||
                item.syncStatus === "SYNCING"
            ) {
                result.push(item);
            }

            cursor.continue();
        };

        request.onerror = () => {
            reject(
                request.error ||
                new Error("SYNC_QUEUE_READ_FAILED")
            );
        };
    });

    db.close();

    if (!items.length) {
        return;
    }

    let token;

    try {
        token = await currentUser.getIdToken(true);
    } catch (error) {
        return;
    }

    const batchSize = 20;

    for (let i = 0; i < items.length; i += batchSize) {
        const batch = items.slice(i, i + batchSize);

        const now = Date.now();

        await updateQueueStatus(
            batch.map(item => item.recordId),
            "SYNCING",
            now,
            ""
        );

        const records = batch.map(item => ({
            recordId: item.recordId,
            recordType: item.recordType,
            shopId: item.shopId,
            agentId: item.agentId,
            operation: item.operation,
            payload: item.payload
        }));

        try {
            const response = await fetch(
                APP_CONFIG.APPS_SCRIPT_URL,
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "text/plain;charset=utf-8"
                    },
                    body: JSON.stringify({
                        action: "batchSync",
                        siteId: APP_CONFIG.SITE_ID,
                        timestamp: Date.now(),
                        nonce: generateNonce(),
                        idToken: token,
                        shopId: batch[0].shopId || "",
                        agentId: batch[0].agentId || "",
                        records: records
                    })
                }
            );

            const text = await response.text();

            let data;

            try {
                data = JSON.parse(text);
            } catch (error) {
                throw new Error(
                    "APPS_SCRIPT_INVALID_RESPONSE"
                );
            }

            if (!response.ok || !data.results) {
                throw new Error(
                    data && data.error
                        ? String(data.error)
                        : "BATCH_SYNC_FAILED"
                );
            }

            await applySyncResults(data.results);
        } catch (error) {
            const message = error && error.message
                ? error.message
                : String(error);

            await updateQueueErrors(
                batch.map(item => item.recordId),
                message
            );
        }
    }
}

async function updateQueueStatus(
    recordIds,
    status,
    timestamp,
    errorMessage
) {
    const db = await openDatabase();

    await new Promise((resolve, reject) => {
        const transaction = db.transaction(
            "sync_queue",
            "readwrite"
        );

        const store = transaction.objectStore(
            "sync_queue"
        );

        recordIds.forEach(recordId => {
            const request = store.get(recordId);

            request.onsuccess = () => {
                const item = request.result;

                if (!item) {
                    return;
                }

                item.syncStatus = status;
                item.lastAttempt = timestamp;
                item.updatedAt = timestamp;

                if (errorMessage) {
                    item.lastError = errorMessage;
                }

                if (status === "SYNCING") {
                    item.lastError = "";
                }

                store.put(item);
            };
        });

        transaction.oncomplete = () => {
            resolve();
        };

        transaction.onerror = () => {
            reject(
                transaction.error ||
                new Error("QUEUE_STATUS_UPDATE_FAILED")
            );
        };
    });

    db.close();
}

async function updateQueueErrors(recordIds, errorMessage) {
    const db = await openDatabase();

    await new Promise((resolve, reject) => {
        const transaction = db.transaction(
            "sync_queue",
            "readwrite"
        );

        const store = transaction.objectStore(
            "sync_queue"
        );

        recordIds.forEach(recordId => {
            const request = store.get(recordId);

            request.onsuccess = () => {
                const item = request.result;

                if (!item) {
                    return;
                }

                item.syncStatus = "ERROR";
                item.retryCount =
                    Number(item.retryCount || 0) + 1;
                item.lastAttempt = Date.now();
                item.updatedAt = Date.now();
                item.lastError = errorMessage;

                store.put(item);
            };
        });

        transaction.oncomplete = () => {
            resolve();
        };

        transaction.onerror = () => {
            reject(
                transaction.error ||
                new Error("QUEUE_ERROR_UPDATE_FAILED")
            );
        };
    });

    db.close();
}

async function applySyncResults(results) {
    const db = await openDatabase();

    await new Promise((resolve, reject) => {
        const transaction = db.transaction(
            ["sync_queue", "products", "sales", "gst_records", "activity_logs"],
            "readwrite"
        );

        const queueStore = transaction.objectStore(
            "sync_queue"
        );

        const stores = {
            PRODUCT: transaction.objectStore("products"),
            PRODUCTS: transaction.objectStore("products"),
            SALE: transaction.objectStore("sales"),
            SALES: transaction.objectStore("sales"),
            GST: transaction.objectStore("gst_records"),
            GST_RECORD: transaction.objectStore("gst_records"),
            ACTIVITY: transaction.objectStore("activity_logs"),
            ACTIVITY_LOG: transaction.objectStore("activity_logs")
        };

        results.forEach(result => {
            if (!result || !result.recordId) {
                return;
            }

            const queueRequest =
                queueStore.get(String(result.recordId));

            queueRequest.onsuccess = () => {
                const queueItem = queueRequest.result;

                if (!queueItem) {
                    return;
                }

                if (result.success) {
                    queueItem.syncStatus = "SENT";
                    queueItem.syncedAt = Date.now();
                    queueItem.updatedAt = Date.now();
                    queueItem.lastAttempt = Date.now();
                    queueItem.lastError = "";

                    queueStore.put(queueItem);

                    const type =
                        String(
                            queueItem.recordType || ""
                        ).toUpperCase();

                    const businessStore =
                        stores[type];

                    if (businessStore) {
                        const businessRequest =
                            businessStore.get(
                                String(result.recordId)
                            );

                        businessRequest.onsuccess = () => {
                            const localRecord =
                                businessRequest.result;

                            if (localRecord) {
                                localRecord.syncStatus =
                                    "SENT";

                                localRecord.syncedAt =
                                    Date.now();

                                localRecord.updatedAt =
                                    Date.now();

                                businessStore.put(
                                    localRecord
                                );
                            }
                        };
                    }
                } else {
                    queueItem.syncStatus = "ERROR";
                    queueItem.retryCount =
                        Number(queueItem.retryCount || 0) + 1;
                    queueItem.lastAttempt = Date.now();
                    queueItem.updatedAt = Date.now();
                    queueItem.lastError =
                        String(
                            result.message ||
                            "REMOTE_SYNC_FAILED"
                        );

                    queueStore.put(queueItem);

                    const type =
                        String(
                            queueItem.recordType || ""
                        ).toUpperCase();

                    const businessStore =
                        stores[type];

                    if (businessStore) {
                        const businessRequest =
                            businessStore.get(
                                String(result.recordId)
                            );

                        businessRequest.onsuccess = () => {
                            const localRecord =
                                businessRequest.result;

                            if (localRecord) {
                                localRecord.syncStatus =
                                    "ERROR";

                                localRecord.updatedAt =
                                    Date.now();

                                localRecord.lastError =
                                    queueItem.lastError;

                                businessStore.put(
                                    localRecord
                                );
                            }
                        };
                    }
                }
            };
        });

        transaction.oncomplete = () => {
            resolve();
        };

        transaction.onerror = () => {
            reject(
                transaction.error ||
                new Error("SYNC_RESULT_APPLY_FAILED")
            );
        };
    });

    db.close();
}

async function initializeAfterLogin(user, profile) {
    setStatus(
        "Login successful. Checking authorization...",
        "info"
    );

    await openDatabase();

    await recoverSyncQueue();

    await saveSessionSettings(
        user,
        profile
    );

    try {
        await updateLastLogin(
            user.uid,
            profile
        );
    } catch (error) {
        if (navigator.onLine) {
            throw error;
        }
    }

    await saveLoginActivity(
        user,
        profile
    );

    try {
        await syncPendingRecords();
    } catch (error) {
    }

    if (profile.role === "admin") {
        window.location.replace("./admin.html");
        return;
    }

    if (profile.role === "agent") {
        window.location.replace("./shop.html");
        return;
    }

    throw new Error("UNSUPPORTED_ROLE");
}

async function handleLogin(email, password) {
    if (!navigator.onLine) {
        setStatus(
            "Internet connection is required for login. Your previously saved local business data remains available after successful session recovery.",
            "warning"
        );
        return;
    }

    setLoginLoading(true);
    clearStatus();

    try {
        const credential =
            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );

        const user = credential.user;

        const profile =
            await getUserProfile(user.uid);

        await initializeAfterLogin(
            user,
            profile
        );
    } catch (error) {
        let message =
            error && error.message
                ? error.message
                : String(error);

        if (
            message.includes("auth/invalid-credential") ||
            message.includes("auth/invalid-login-credentials")
        ) {
            message = "Email or password is incorrect.";
        } else if (
            message.includes("auth/user-disabled")
        ) {
            message = "This Firebase account is disabled.";
        } else if (
            message.includes("auth/too-many-requests")
        ) {
            message = "Too many login attempts. Please try again later.";
        } else if (
            message === "USER_PROFILE_NOT_FOUND"
        ) {
            message = "Firebase login succeeded, but user authorization profile was not found.";
        } else if (
            message === "USER_ACCOUNT_DISABLED"
        ) {
            message = "Your account is disabled.";
        } else if (
            message === "INVALID_USER_ROLE"
        ) {
            message = "Your account has an invalid role.";
        } else if (
            message === "AGENT_SHOP_NOT_ASSIGNED"
        ) {
            message = "This agent is not assigned to a shop.";
        } else if (
            message === "APPS_SCRIPT_INIT_FAILED"
        ) {
            message = "Remote sync gateway initialization failed.";
        } else if (
            message === "APPS_SCRIPT_INVALID_RESPONSE"
        ) {
            message = "Remote sync gateway returned an invalid response.";
        }

        try {
            await signOut(auth);
        } catch (signOutError) {
        }

        setStatus(
            message,
            "error"
        );
    } finally {
        setLoginLoading(false);
    }
}

passwordToggle.addEventListener(
    "click",
    () => {
        const isPassword =
            passwordInput.type === "password";

        passwordInput.type =
            isPassword ? "text" : "password";

        passwordToggle.textContent =
            isPassword ? "🙈" : "👁";

        passwordToggle.setAttribute(
            "aria-label",
            isPassword
                ? "Hide password"
                : "Show password"
        );
    }
);

loginForm.addEventListener(
    "submit",
    async event => {
        event.preventDefault();

        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;

        if (!email || !password) {
            setStatus(
                "Please enter email and password.",
                "error"
            );
            return;
        }

        await handleLogin(
            email,
            password
        );
    }
);

window.addEventListener(
    "online",
    () => {
        setConnectionStatus();

        if (auth.currentUser) {
            recoverSyncQueue()
                .then(syncPendingRecords)
                .catch(() => {});
        }
    }
);

window.addEventListener(
    "offline",
    () => {
        setConnectionStatus();
    }
);

document.addEventListener(
    "visibilitychange",
    () => {
        if (
            document.visibilityState === "visible" &&
            auth.currentUser &&
            navigator.onLine
        ) {
            recoverSyncQueue()
                .then(syncPendingRecords)
                .catch(() => {});
        }
    }
);

setConnectionStatus();

async function initializeFirebaseSession() {
    try {
        await setPersistence(
            auth,
            browserSessionPersistence
        );
    } catch (error) {
        setStatus(
            "Unable to initialize secure browser session.",
            "error"
        );
        return;
    }

    onAuthStateChanged(
        auth,
        async user => {
            if (!user || redirecting) {
                return;
            }

            redirecting = true;

            try {
                const profile =
                    await getUserProfile(
                        user.uid
                    );

                if (
                    profile.status !== "active"
                ) {
                    await signOut(auth);
                    redirecting = false;

                    setStatus(
                        "Your account is disabled.",
                        "error"
                    );

                    return;
                }

                await openDatabase();

                await recoverSyncQueue();

                await saveSessionSettings(
                    user,
                    profile
                );

                if (navigator.onLine) {
                    try {
                        await updateLastLogin(
                            user.uid,
                            profile
                        );
                    } catch (error) {
                    }

                    try {
                        await syncPendingRecords();
                    } catch (error) {
                    }
                }

                if (profile.role === "admin") {
                    window.location.replace(
                        "admin.html"
                    );
                    return;
                }

                if (profile.role === "agent") {
                    window.location.replace(
                        "shop.html"
                    );
                    return;
                }

                await signOut(auth);

                redirecting = false;

                setStatus(
                    "Invalid account role.",
                    "error"
                );
            } catch (error) {
                try {
                    await signOut(auth);
                } catch (signOutError) {
                }

                redirecting = false;

                setStatus(
                    "Authorization failed: " +
                    (
                        error && error.message
                            ? error.message
                            : "Unknown error"
                    ),
                    "error"
                );
            }
        }
    );
}

initializeFirebaseSession();
