
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Shop Login Test</title>
<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#111827}
.container{width:min(600px,94%);margin:40px auto}
.card{background:#fff;border-radius:12px;padding:24px;box-shadow:0 4px 18px rgba(0,0,0,.08)}
h1{margin:0 0 20px;font-size:24px}
input{width:100%;padding:12px;margin:6px 0;border:1px solid #d1d5db;border-radius:8px;font-size:15px}
button{width:100%;padding:12px;margin-top:10px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-size:15px;cursor:pointer}
button:disabled{opacity:.6;cursor:not-allowed}
.status{margin-top:18px;padding:14px;border-radius:8px;background:#111827;color:#fff;white-space:pre-wrap;word-break:break-word;font-family:monospace;font-size:13px;line-height:1.5}
.success{background:#166534}
.error{background:#991b1b}
.info{background:#1e3a8a}
.hidden{display:none}
hr{border:0;border-top:1px solid #e5e7eb;margin:20px 0}
</style>
</head>
<body>

<div class="container">
<div class="card">

<h1>Shop Login Test</h1>

<div id="loginBox">
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button id="loginBtn">Login</button>
</div>

<button id="logoutBtn" class="hidden">Logout</button>

<hr>

<div id="status" class="status info">Initializing Firebase...</div>

</div>
</div>

<script>
const firebaseConfig={
apiKey:"AIzaSyApCoYU29E90_fORBdOKnR8BroSlURI_20",
authDomain:"shop-management-system-9093.firebaseapp.com",
databaseURL:"https://shop-management-system-9093-default-rtdb.asia-southeast1.firebasedatabase.app/",
projectId:"shop-management-system-9093",
storageBucket:"shop-management-system-9093.firebasestorage.app",
messagingSenderId:"108966486935",
appId:"1:108966486935:web:47ffa7b9eb7b6d69a81ad2"
};

firebase.initializeApp(firebaseConfig);

const auth=firebase.auth();
const db=firebase.database();

const emailEl=document.getElementById("email");
const passwordEl=document.getElementById("password");
const loginBtn=document.getElementById("loginBtn");
const logoutBtn=document.getElementById("logoutBtn");
const loginBox=document.getElementById("loginBox");
const statusEl=document.getElementById("status");

let currentUser=null;

function showStatus(message,type="info"){
    statusEl.className="status "+type;
    statusEl.textContent=message;
}

function now(){
    return new Date().toISOString();
}

function printLoginSuccess(user){
    const lines=[
        "LOGIN TEST",
        "----------------------------------------",
        "DATE: "+now(),
        "STATUS: SUCCESS",
        "EMAIL: "+(user.email||""),
        "UID: "+(user.uid||""),
        "DISPLAY NAME: "+(user.displayName||""),
        "EMAIL VERIFIED: "+String(user.emailVerified),
        "CREATED: "+(user.metadata?.creationTime||""),
        "LAST SIGN IN: "+(user.metadata?.lastSignInTime||""),
        "----------------------------------------"
    ];

    showStatus(lines.join("\n"),"success");
}

async function testAgentAccess(user){

    const uid=user.uid;

    showStatus(
        "LOGIN SUCCESS\n\n"+
        "Testing agent access...\n"+
        "Firebase UID: "+uid+
        "\n\nReading agent_access/"+uid+"...",
        "info"
    );

    try{

        const uidSnapshot=await db.ref("agent_access/"+uid).once("value");

        if(uidSnapshot.exists()){

            const data=uidSnapshot.val();

            showStatus(
                "LOGIN TEST\n"+
                "----------------------------------------\n"+
                "DATE: "+now()+"\n"+
                "STATUS: SUCCESS\n"+
                "EMAIL: "+(user.email||"")+"\n"+
                "UID: "+uid+"\n"+
                "AGENT ID: "+uid+"\n"+
                "PATH: agent_access/"+uid+"\n"+
                "RECORD FOUND: YES\n"+
                "DATA:\n"+
                JSON.stringify(data,null,2)+"\n"+
                "----------------------------------------",
                "success"
            );

            return;
        }

        const userPaths=[
            "users/"+uid,
            "agents/"+uid,
            "user_profiles/"+uid
        ];

        for(const path of userPaths){

            const snapshot=await db.ref(path).once("value");

            if(!snapshot.exists()) continue;

            const data=snapshot.val()||{};

            const possibleAgentId=
                data.agentId||
                data.agentID||
                data.agent_id||
                data.id||
                null;

            if(!possibleAgentId) continue;

            const agentSnapshot=
                await db.ref("agent_access/"+possibleAgentId).once("value");

            if(agentSnapshot.exists()){

                showStatus(
                    "LOGIN TEST\n"+
                    "----------------------------------------\n"+
                    "DATE: "+now()+"\n"+
                    "STATUS: SUCCESS\n"+
                    "EMAIL: "+(user.email||"")+"\n"+
                    "UID: "+uid+"\n"+
                    "PROFILE PATH: "+path+"\n"+
                    "AGENT ID: "+possibleAgentId+"\n"+
                    "AGENT ACCESS PATH: agent_access/"+possibleAgentId+"\n"+
                    "RECORD FOUND: YES\n"+
                    "DATA:\n"+
                    JSON.stringify(agentSnapshot.val(),null,2)+"\n"+
                    "----------------------------------------",
                    "success"
                );

                return;
            }
        }

        showStatus(
            "LOGIN TEST\n"+
            "----------------------------------------\n"+
            "DATE: "+now()+"\n"+
            "STATUS: LOGIN SUCCESS\n"+
            "EMAIL: "+(user.email||"")+"\n"+
            "UID: "+uid+"\n"+
            "AGENT ID: NOT FOUND\n"+
            "----------------------------------------\n"+
            "agent_access/"+uid+" does not exist.\n"+
            "No agentId was found in the tested profile paths.\n"+
            "----------------------------------------",
            "error"
        );

    }catch(error){

        showStatus(
            "LOGIN TEST\n"+
            "----------------------------------------\n"+
            "DATE: "+now()+"\n"+
            "STATUS: DATABASE ERROR\n"+
            "EMAIL: "+(user.email||"")+"\n"+
            "UID: "+uid+"\n"+
            "ERROR CODE: "+(error.code||"")+"\n"+
            "ERROR: "+(error.message||String(error))+"\n"+
            "----------------------------------------",
            "error"
        );

        console.error("[ShopAuth] Firebase Database Error",error);
    }
}

loginBtn.addEventListener("click",async function(){

    const email=emailEl.value.trim();
    const password=passwordEl.value;

    if(!email){
        showStatus("EMAIL IS REQUIRED","error");
        return;
    }

    if(!password){
        showStatus("PASSWORD IS REQUIRED","error");
        return;
    }

    loginBtn.disabled=true;

    showStatus(
        "LOGIN TEST\n"+
        "----------------------------------------\n"+
        "DATE: "+now()+"\n"+
        "STATUS: LOGIN IN PROGRESS\n"+
        "EMAIL: "+email+"\n"+
        "----------------------------------------",
        "info"
    );

    try{

        const result=await auth.signInWithEmailAndPassword(email,password);

        currentUser=result.user;

        printLoginSuccess(currentUser);

        loginBox.classList.add("hidden");
        logoutBtn.classList.remove("hidden");

        await testAgentAccess(currentUser);

    }catch(error){

        currentUser=null;

        showStatus(
            "LOGIN TEST\n"+
            "----------------------------------------\n"+
            "DATE: "+now()+"\n"+
            "STATUS: FAILED\n"+
            "ERROR CODE: "+(error.code||"")+"\n"+
            "ERROR: "+(error.message||String(error))+"\n"+
            "----------------------------------------",
            "error"
        );

        console.error("[ShopAuth] Login Error",error);

    }finally{

        loginBtn.disabled=false;

    }
});

logoutBtn.addEventListener("click",async function(){

    try{

        await auth.signOut();

        currentUser=null;

        loginBox.classList.remove("hidden");
        logoutBtn.classList.add("hidden");

        passwordEl.value="";

        showStatus(
            "LOGOUT TEST\n"+
            "----------------------------------------\n"+
            "DATE: "+now()+"\n"+
            "STATUS: SUCCESS\n"+
            "----------------------------------------",
            "success"
        );

    }catch(error){

        showStatus(
            "LOGOUT FAILED\n"+
            "ERROR CODE: "+(error.code||"")+"\n"+
            "ERROR: "+(error.message||String(error)),
            "error"
        );

    }

});

auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL)
.then(function(){

    console.log("[ShopAuth] Firebase persistence = LOCAL");

    showStatus(
        "Firebase initialized.\n"+
        "Persistence: LOCAL\n"+
        "Waiting for login...",
        "info"
    );

    return new Promise(function(resolve){
        const unsubscribe=auth.onAuthStateChanged(async function(user){

            unsubscribe();

            if(user){

                currentUser=user;

                loginBox.classList.add("hidden");
                logoutBtn.classList.remove("hidden");

                printLoginSuccess(user);

                await testAgentAccess(user);

            }else{

                currentUser=null;

                console.log("[ShopAuth] No Firebase login session.");

                showStatus(
                    "Firebase initialized.\n"+
                    "Persistence: LOCAL\n"+
                    "STATUS: NOT LOGGED IN\n"+
                    "Enter email and password, then press Login.",
                    "info"
                );

            }

            resolve();

        });
    });

})
.catch(function(error){

    console.error("[ShopAuth] Firebase initialization error",error);

    showStatus(
        "FIREBASE INITIALIZATION ERROR\n"+
        "----------------------------------------\n"+
        "ERROR CODE: "+(error.code||"")+"\n"+
        "ERROR: "+(error.message||String(error)),
        "error"
    );

});
</script>

</body>
</html>
